# CodeRabbit configuration.
# Schema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

reviews:
  auto_review:
    # This repository is reviewed by CodeRabbit, not GitHub Copilot.
    #
    # Switched on 2026-09-21 because Copilot stopped reviewing, not because
    # anything about this repository changed. It is still at 4 stars. On
    # PR #44 Copilot answered with:
    #
    #   Copilot was unable to review this pull request because the user who
    #   requested the review has reached their quota limit.
    #
    # That quota is per requesting user, so it took out every repository on
    # the Copilot side of the routing table at once, and no per-repository
    # setting can restore any of them. The Copilot ruleset here
    # (copilot-auto-review, id 23603874) is set to enforcement=disabled
    # rather than deleted, so re-enabling is one field.
    #
    # WHAT ACTUALLY TRIGGERS A REVIEW HERE.
    #
    # The flag below is not the mechanism, and reading it as one is the
    # mistake this comment exists to prevent. CodeRabbit's OSS tier requires
    # a public repository under 10 stars to have its reviews triggered by
    # hand. Until the Advanced trial ends on 2026-10-02 this repository is
    # still on trial terms and enabled: true does produce automatic review;
    # after that date it produces nothing, whatever it says, and every pull
    # request needs a top-level comment:
    #
    #   @coderabbitai review
    #
    # It is left true because it is correct for the trial days and because
    # false would have to be re-flipped by hand at 10 stars, which is the
    # kind of exit condition that never gets performed. The manual comment
    # is the documented escape hatch and works in both periods, so it is the
    # safe thing to do on any pull request without checking the date.
    #
    # Do not carry the Copilot gate's logic across. The two define a clean
    # pass differently, and on the Copilot switchover a filter reused from
    # the previous reviewer matched nothing and reported a clean pass on a
    # pull request with three findings. Read the gate from the CodeRabbit
    # skill, not from memory of the other one.
    enabled: true
    # 0 disables the pause entirely, which is the schema's documented sentinel
    # ("Set to 0 to disable"), not a large number chosen by hand. At the default
    # of 5, automatic review stops silently once a pull request has five
    # reviewed commits, and a poller waiting on the verdict reads that pause as
    # a timeout rather than as a stop. Measured: sepia#250 ran four rounds.
    auto_pause_after_reviewed_commits: 0

  pre_merge_checks:
    docstrings:
      # Off, because it cannot be pointed at the files this repository
      # actually keeps docstrings in, and off is honest about that.
      #
      # The check's denominator is every function a diff touches, and there is
      # no path scoping for it: the schema gives `mode` and `threshold` and
      # nothing else. `reviews.path_filters` would scope it, by excluding the
      # test files from review altogether -- which costs more than it saves,
      # since CodeRabbit reading the tests is what found the scam-target
      # defect on PR #44.
      #
      # Measured on PR #44 (2026-09-22). It reported 33.33% against a 80.00%
      # threshold. Both production functions in that diff had docstrings; the
      # two that did not were test methods:
      #
      #   messagewatch.py         84/87  = 96.6%
      #   test_messagewatch.py     2/209 =  1.0%
      #
      # Test methods here carry their sentence in the name and their reasoning
      # in inline comments, across all 209 of them. Writing docstrings for two
      # of them to move a percentage would satisfy the metric and leave the
      # file less consistent than before.
      #
      # A threshold low enough to pass that diff would be a number picked to
      # fit one PR, and it would drift the moment the ratio of production to
      # test functions changed. Turning the check off says what is true: this
      # repository does not measure the thing the check measures.
      #
      # Quoted because YAML 1.1 reads a bare `off` as the boolean false, and
      # the schema wants the string. Written unquoted first, and the parser
      # returned `{'docstrings': {'mode': False}}`.
      mode: "off"

knowledge_base:
  code_guidelines:
    # Enabled by default, but pointed at nothing by default. These are the
    # files this repository already states its rules in.
    filePatterns:
      - "README.md"
